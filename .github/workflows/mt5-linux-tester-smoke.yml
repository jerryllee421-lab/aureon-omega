name: MT5 Linux Tester Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mt5-linux-tester-smoke
    paths:
      - '.github/workflows/mt5-linux-tester-smoke.yml'
      - 'scripts/mt5_linux_compile.sh'
      - 'scripts/mt5_linux_tester_smoke.sh'
      - 'ea/baseline/**'
      - 'ea/tools/**'

permissions:
  contents: read

env:
  WINEARCH: win64
  WINEDEBUG: -all
  MT5_INSTALLER_URL: https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe

jobs:
  tester-smoke:
    name: Ubuntu + Wine + MT5 Strategy Tester
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WineHQ stable and headless display
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          curl -fsSL https://dl.winehq.org/wine-builds/winehq.key \
            | sudo tee /etc/apt/keyrings/winehq-archive.key >/dev/null
          sudo curl -fsSL \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources \
            -o /etc/apt/sources.list.d/winehq-noble.sources
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --install-recommends \
            winehq-stable xvfb xauth cabextract winbind curl ca-certificates p7zip-full
          wine --version
          wine --version | tee "$RUNNER_TEMP/wine-version.txt"
          wine_major="$(wine --version | sed -E 's/^wine-([0-9]+).*/\1/')"
          if [ "$wine_major" -lt 10 ]; then
            echo "MT5 build 6182 requires Wine 10 or later; installed: $(wine --version)"
            exit 1
          fi

      - name: Install MT5 and compile FVG baseline
        shell: bash
        run: bash scripts/mt5_linux_compile.sh

      - name: Run MT5 Strategy Tester smoke
        shell: bash
        run: bash scripts/mt5_linux_tester_smoke.sh

      - name: Upload tester evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-linux-tester-smoke-${{ github.run_id }}
          path: |
            mt5_ci_artifact
            mt5_tester_artifact
          retention-days: 30
          if-no-files-found: warn
