name: AUREON validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: aureon-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python research syntax gate
        run: |
          python -m py_compile scripts/*.py research/*.py
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test
      - run: npm run build
