name: AUREON validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: aureon-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install research Python dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Validate research Python syntax
        run: python -m py_compile research/fvg_v211.py research/run_research.py research/mirror_m1.py research/resample_validate.py research/tools/offline_tick_replay.py research/tools/timestamp_units.py research/tools/audit_2025_tick_archive.py
      - name: Test offline tick replay parsing guards
        run: python -m unittest research.tests.test_offline_tick_replay
      - name: Test epoch timestamp unit inference
        run: python -m unittest research.tests.test_timestamp_units
