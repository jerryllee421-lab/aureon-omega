name: AUREON validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: aureon-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Validate research Python syntax
        run: python -m py_compile research/fvg_v211.py research/run_research.py research/mirror_m1.py research/resample_validate.py research/tools/offline_tick_replay.py research/tools/quote_execution.py research/tools/smc_intraday_candidates.py research/tools/strategy_intelligence.py
      - name: Install tick research test dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow
      - name: Test offline tick replay parsing guards
        run: python -m unittest research.tests.test_offline_tick_replay
      - name: Test quote-level execution mechanics
        run: python -m unittest research.tests.test_quote_execution
      - name: Test SMC intraday candidate engine
        run: python -m unittest research.tests.test_smc_intraday_candidates
      - name: Test context-aware strategy intelligence\n        run: python -m unittest research.tests.test_strategy_intelligence\n