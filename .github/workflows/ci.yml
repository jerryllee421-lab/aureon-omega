name: AUREON validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: aureon-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install research dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Validate research Python syntax and CLI entry points
        run: |
          python -m py_compile research/*.py
          python research/duka_m1.py --help > /dev/null
          python research/resample_validate.py --help > /dev/null
          python research/run_research.py --help > /dev/null
      - name: Test R13 worker visibility policy model
        run: python -m unittest discover -s research/r13 -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test
      - run: npm run build
