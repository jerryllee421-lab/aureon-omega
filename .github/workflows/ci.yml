name: AUREON validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: aureon-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install lightweight parquet research test dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=19,<22'
      - name: Validate research and execution-gate Python syntax
        run: python -m py_compile research/fvg_v211.py research/run_research.py research/mirror_m1.py research/resample_validate.py research/evolution/adaptive_prediction.py research/evolution/walk_forward.py research/evolution/cost_stress.py research/evolution/run_adaptive_lab.py research/evolution/run_local_gold_dataset.py research/evolution/audit_dukascopy_tick_archive.py execution/mt5_demo_gate.py
      - name: Test research leakage, data quality, and fail-closed behavior
        run: python -m unittest discover -s tests -p 'test_*.py' -v
