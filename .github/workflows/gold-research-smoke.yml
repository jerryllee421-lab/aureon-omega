name: AUREON Gold Research Smoke

on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - '.github/workflows/gold-research*.yml'
      - 'ea/baseline/**'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - name: Resolve 14-day UTC smoke range
        id: dates
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date, timedelta
          end=date.today()
          start=end-timedelta(days=14)
          print(f"start={start.isoformat()}")
          print(f"end={end.isoformat()}")
          PY
      - name: Download XAUUSD smoke data
        run: python research/duka_m1.py --symbol XAUUSD --start '${{ steps.dates.outputs.start }}' --end '${{ steps.dates.outputs.end }}' --workers 8
      - name: Validate all standard timeframes
        run: python research/resample_validate.py --root research_data --symbol XAUUSD
      - name: Run compact M5 FVG research
        run: python research/run_research.py --data research_data/XAUUSD/canonical/XAUUSD_M5.parquet --max-candidates 4
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-research-smoke-${{ github.run_id }}
          path: |
            research_results
            research_data/XAUUSD/download_manifest.json
            research_data/XAUUSD/validation_manifest.json
          retention-days: 7
          if-no-files-found: warn
