name: MQL5 native compile validation

on:
  pull_request:
    paths:
      - 'qa/mql5/**'
      - 'qa/Run-Aureon-MQL5-Compile.ps1'
      - '.github/workflows/mql5-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run one-click native compile diagnostics
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'qa\Run-Aureon-MQL5-Compile.ps1'
          $sources = Join-Path $env:GITHUB_WORKSPACE 'qa\mql5'
          $evidence = Join-Path $env:RUNNER_TEMP 'mql5-evidence'
          & $script -SourceDirectory $sources -OutputDirectory $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aureon-mql5-compile-evidence
          path: ${{ runner.temp }}\mql5-evidence\**
          if-no-files-found: warn
