name: ASTRA Broker Symbol Truth

on:
  workflow_dispatch:
  push:
    branches:
      - feature/astra-campaign-ea-v1
    paths:
      - 'research/requests/astra-broker-symbol-truth.json'

permissions:
  contents: read

concurrency:
  group: astra-broker-symbol-truth-${{ github.ref }}
  cancel-in-progress: true

env:
  MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
  MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
  MT5_DEMO_SERVER: PXBTTrading-1
  MT5_INSTALLER_URL: https://download.terminal.free/cdn/web/pxbt.trading.ltd/mt5/pxbttrading5setup.exe

jobs:
  broker-symbol-truth:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MT5 Python bridge
        shell: pwsh
        run: python -m pip install --disable-pip-version-check MetaTrader5

      - name: Require demo authentication
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:MT5_DEMO_LOGIN) -or
             [string]::IsNullOrWhiteSpace($env:MT5_DEMO_PASSWORD)){
            throw 'MT5 demo login/password Actions secrets are required.'
          }

      - name: Install official PrimeXBT MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\AUREON_MT5_TRUTH'
          $installer=Join-Path $env:RUNNER_TEMP 'pxbttrading5setup.exe'
          Invoke-WebRequest -Uri $env:MT5_INSTALLER_URL -OutFile $installer
          if((Get-Item $installer).Length -lt 100000){ throw 'PrimeXBT MT5 installer download is unexpectedly small' }
          $p=Start-Process -FilePath $installer -ArgumentList @('/auto',"/path:$root") -PassThru
          $null=$p.WaitForExit(600000)
          $deadline=(Get-Date).AddMinutes(3)
          while((Get-Date) -lt $deadline -and -not (Test-Path "$root\metaeditor64.exe")){ Start-Sleep -Seconds 2 }
          if(-not (Test-Path "$root\metaeditor64.exe")){ throw 'MetaEditor missing after broker install' }
          "MT5_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile broker symbol probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:MT5_ROOT
          $mql5=Join-Path $root 'MQL5'
          $dir=Join-Path $mql5 'Scripts\AUREON'
          New-Item -ItemType Directory -Force -Path $dir,'broker_truth' | Out-Null
          $probe=Join-Path $dir 'AUREON_BrokerSymbolProbe.mq5'
          Copy-Item 'ea/astra/tools/AUREON_BrokerSymbolProbe.mq5' $probe -Force
          $p=Start-Process -FilePath "$root\metaeditor64.exe" -ArgumentList @("/compile:$probe","/include:$mql5",'/log') -PassThru
          if(-not $p.WaitForExit(180000)){ $p.Kill(); throw 'Broker probe compile timeout' }
          Start-Sleep -Seconds 2
          $log=[IO.Path]::ChangeExtension($probe,'.log')
          $ex5=[IO.Path]::ChangeExtension($probe,'.ex5')
          if(-not (Test-Path $log) -or -not (Test-Path $ex5)){ throw 'Broker probe compile output missing' }
          $txt=Get-Content $log -Raw -Encoding Unicode
          $txt | Out-File 'broker_truth\compile.log' -Encoding utf8
          if($txt -notmatch '0 errors' -or $txt -notmatch '0 warnings'){ throw 'Broker probe compile was not clean' }

      - name: Prewarm authenticated broker session
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:MT5_ROOT
          $cfg=Join-Path $root 'broker-prewarm.ini'
          @"
          [Common]
          Login=$($env:MT5_DEMO_LOGIN)
          Password=$($env:MT5_DEMO_PASSWORD)
          Server=$($env:MT5_DEMO_SERVER)
          KeepPrivate=0
          NewsEnable=0

          [Experts]
          Enabled=0
          AllowLiveTrading=0
          AllowDllImport=0
          "@ | Set-Content -Path $cfg -Encoding Unicode
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath "$root\terminal64.exe" -ArgumentList @('/portable',"/config:$cfg") -PassThru
          Start-Sleep -Seconds 25
          $logs=''
          Get-ChildItem "$root\Logs" -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object {
            try { $logs += (Get-Content $_.FullName -Raw -Encoding Unicode) + "`n" } catch {}
          }
          $logs | Out-File 'broker_truth\prewarm-terminal.log' -Encoding utf8
          if(-not $p.HasExited){ $p.Kill() }
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if($logs -notmatch 'authorized on' -and $logs -notmatch 'terminal synchronized with'){
            Write-Warning 'Prewarm did not prove authorization; Python probe will emit the definitive diagnostic.'
          }

      - name: Discover and fingerprint Gold symbol
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:MT5_ROOT
          New-Item -ItemType Directory -Force -Path 'broker_truth' | Out-Null
          python scripts/mt5_broker_truth.py --terminal "$root\terminal64.exe" --out broker_truth
          if($LASTEXITCODE -ne 0){ throw 'Python MT5 broker truth probe failed' }
          $selected=(Get-Content 'broker_truth\selected-symbol.txt' -Raw).Trim()
          if([string]::IsNullOrWhiteSpace($selected)){ throw 'Broker truth selected symbol is empty' }
          Write-Host ("Resolved broker-native Gold symbol: "+$selected)
          @(
            'SERVER='+$env:MT5_DEMO_SERVER,
            'SYMBOL='+$selected,
            'ALLOW_LIVE_TRADING=0',
            'ORDERS_PLACED=0'
          ) | Set-Content 'broker_truth\context.txt'
          git rev-parse HEAD | Set-Content 'broker_truth\source_commit.txt'

      - name: Upload broker truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-broker-symbol-truth-${{ github.run_id }}
          path: broker_truth
          retention-days: 30
          if-no-files-found: warn
