name: AUREON VWAP EMA Tick Replay

on:
  push:
    branches: [feature/adaptive-prediction-engine]
    paths:
      - ".github/workflows/aureon-vwap-ema-tick-replay.yml"
      - "research/replay/aureon_vwap_ema_tick_replay.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and verify October third-party tick archive
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/xauusd-dukascopy-ticks-2026-10-01-to-2026-10-20-6439b55/xauusd-ticks-2026-10.zip"
          curl --fail --location --retry 4 --retry-all-errors "$URL" -o /tmp/xauusd-ticks.zip
          echo "d354c8769bd4d6f6c5a57a7da87843acdddec4f03815137b339c6ed5786069b0  /tmp/xauusd-ticks.zip" | sha256sum --check
      - name: Install replay dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow
      - name: Run tick-level strategy replay proxy
        run: |
          python research/replay/aureon_vwap_ema_tick_replay.py --archive /tmp/xauusd-ticks.zip --out test-results
      - name: Upload replay report and trade ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aureon-vwap-ema-tick-replay
          path: test-results/
          if-no-files-found: warn
