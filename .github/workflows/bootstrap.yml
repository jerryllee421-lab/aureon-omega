name: Bootstrap AUREON Omega
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified AUREON source
        shell: bash
        run: |
          cat .bootstrap/bundle.part.* | base64 -d > /tmp/aureon.zip
          echo "395c194d4138fa20d767e72b34aebd59a1f41316d8962f8a2180a579baa491cb  /tmp/aureon.zip" | sha256sum -c -
          unzip -o /tmp/aureon.zip -d .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand AUREON Ω production source"
          git push origin HEAD:main
