name: cTrader Native Build

on:
  push:
    branches: [main, feature/ctrader-demo-canary-hardening, release/v217-demo-canary-armed]
    paths:
      - 'ctrader-cloud/**'
      - '.github/workflows/ctrader-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup cTrader CLI compatibility runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Verify .NET runtimes
        run: dotnet --list-runtimes

      - name: Install Homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Install official cTrader CLI
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap spotware/tap https://github.com/spotware/homebrew-tap
          brew install spotware/tap/ctrader-cli
          ctrader-cli --version

      - name: cTrader CLI cBot metadata sanity probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ctrader-probe
          mkdir -p /tmp/ctrader-probe
          cd /tmp/ctrader-probe
          ctrader-cli create cbot ProbeBot csharp
          PROBE_PROJECT="$HOME/cAlgo/Sources/Robots/ProbeBot/ProbeBot/ProbeBot.csproj"
          ctrader-cli build "$PROBE_PROJECT"
          PROBE_ALGO="$HOME/cAlgo/Sources/Robots/ProbeBot.algo"
          test -n "$PROBE_ALGO"
          echo "=== OFFICIAL CLI-GENERATED CBOT METADATA ==="
          ctrader-cli metadata "$PROBE_ALGO"

      - name: Native cTrader cBot build
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$HOME/cAlgo/Sources/Robots/AUREONPrimeGoldCloud/AUREONPrimeGoldCloud"
          rm -rf "$HOME/cAlgo/Sources/Robots/AUREONPrimeGoldCloud"
          mkdir -p "$STAGE"
          cp ctrader-cloud/AUREONPrimeGoldCloud.cs "$STAGE/AUREONPrimeGoldCloud.cs"
          cp ctrader-cloud/AUREONPrimeGoldCloud.csproj "$STAGE/AUREONPrimeGoldCloud.csproj"
          ctrader-cli build "$STAGE/AUREONPrimeGoldCloud.csproj" | tee /tmp/aureon-build.json
          python - <<'PY'
          import json
          with open("/tmp/aureon-build.json", "r", encoding="utf-8") as f:
              build=json.load(f)
          assert build.get("success") is True, build
          assert build.get("errors") in ([], None), build
          assert build.get("warnings") in ([], None), build
          print("AUREON official cTrader CLI build: PASS")
          PY

      - name: Locate, assert cBot, and inspect .algo
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          ALGO="$HOME/cAlgo/Sources/Robots/AUREONPrimeGoldCloud.algo"
          if [ ! -f "$ALGO" ]; then
            ROOT="$HOME/cAlgo/Sources/Robots/AUREONPrimeGoldCloud"
            ALGO="$(find "$ROOT" -type f -name '*.algo' | head -n 1)"
          fi
          test -n "$ALGO"
          test -f "$ALGO"
          echo "algo=$ALGO" >> "$GITHUB_OUTPUT"
          ctrader-cli metadata "$ALGO" | tee /tmp/aureon-metadata.json
          python - <<'PY'
          import json
          with open("/tmp/aureon-metadata.json", "r", encoding="utf-8") as f:
              metadata=json.load(f)
          assert metadata.get("Type") == "cBot", f"Expected cBot artifact, got {metadata.get('Type')!r}"
          params={p["PropertyName"]: p for p in metadata.get("Parameters", [])}
          assert params["ExecutionEnabled"]["DefaultValue"] is True
          assert params["EnvironmentName"]["DefaultValue"].lower() == "demo"
          assert params["ExpectedBroker"]["DefaultValue"] == "Pepperstone"
          assert params["CanaryMaxCompletedTrades"]["DefaultValue"] == 5
          assert params["OneTradePerFvg"]["DefaultValue"] is False
          print("AUREON armed cBot metadata contract: PASS")
          PY
          sha256sum "$ALGO" | tee ctrader-cloud/AUREON_FVG_V2_17_Forward_ARMED.sha256

      - name: Upload native .algo
        uses: actions/upload-artifact@v4
        with:
          name: AUREON-FVG-V2-17-cTrader-native
          path: |
            ${{ steps.artifact.outputs.algo }}
            ctrader-cloud/AUREON_FVG_V2_17_Forward_ARMED.sha256
          if-no-files-found: error
          retention-days: 30
