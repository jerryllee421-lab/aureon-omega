name: ASTRA Fast OHLC Research Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - feature/astra-campaign-ea-v1
    paths:
      - 'research/requests/astra-fast-ohlc.json'

permissions:
  contents: read

env:
  MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
  MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
  MT5_DEMO_SERVER: PXBTTrading-1
  MT5_INSTALLER_URL: https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe
  XAU_MIRROR_COMMIT: 922f83a60cc574e7395fb27397077288055a1ef6
  TEST_FROM: '2025-08-20'
  TEST_TO: '2026-08-20'

jobs:
  fast-ohlc:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Build pinned one-year Dukascopy XAUUSD M1 dataset
        shell: pwsh
        run: |
          python research/mirror_m1.py --start $env:TEST_FROM --end $env:TEST_TO --commit $env:XAU_MIRROR_COMMIT --output research_data
          python research/export_mt5_m1.py --root research_data --symbol XAUUSD --point 0.001 --output mt5_input/ASTRA_XAUUSD_M1.csv

      - name: Install official MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\AUREON_MT5_FAST'
          $installer=Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri $env:MT5_INSTALLER_URL -OutFile $installer
          $p=Start-Process -FilePath $installer -ArgumentList @('/auto',"/path:$root") -PassThru
          if(-not $p.WaitForExit(600000)){ $p.Kill(); throw 'MT5 installer timed out' }
          $deadline=(Get-Date).AddMinutes(3)
          while((Get-Date) -lt $deadline -and -not (Test-Path "$root\metaeditor64.exe")){ Start-Sleep -Seconds 2 }
          if(-not (Test-Path "$root\metaeditor64.exe")){ throw 'MetaEditor missing after install' }
          & "$root\terminal64.exe" /portable
          Start-Sleep -Seconds 8
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "MT5_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile ASTRA EA and loader
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:MT5_ROOT
          $mql5=Join-Path $root 'MQL5'
          $eaDir=Join-Path $mql5 'Experts\AUREON'
          $scriptDir=Join-Path $mql5 'Scripts\AUREON'
          New-Item -ItemType Directory -Force -Path $eaDir,$scriptDir,'fast_artifact' | Out-Null
          $ea=Join-Path $eaDir 'AUREON_ASTRA_GOLD_CAMPAIGN_V1.mq5'
          $loader=Join-Path $scriptDir 'AUREON_CustomSymbolLoader.mq5'
          Copy-Item 'ea/astra/AUREON_ASTRA_GOLD_CAMPAIGN_V1.mq5' $ea -Force
          Copy-Item 'ea/astra/tools/AUREON_CustomSymbolLoader.mq5' $loader -Force

          function Compile-Mql([string]$source,[string]$label){
            $meta=Join-Path $root 'metaeditor64.exe'
            $p=Start-Process -FilePath $meta -ArgumentList @("/compile:$source","/include:$mql5",'/log') -PassThru
            if(-not $p.WaitForExit(180000)){ $p.Kill(); throw "$label compile timeout" }
            Start-Sleep -Seconds 2
            $log=[IO.Path]::ChangeExtension($source,'.log')
            $ex5=[IO.Path]::ChangeExtension($source,'.ex5')
            if(-not (Test-Path $log)){ throw "$label compile log missing" }
            $txt=Get-Content $log -Raw -Encoding Unicode
            $txt | Out-File ("fast_artifact\"+$label+"-compile.log") -Encoding utf8
            if($txt -notmatch '0 errors'){ throw "$label has compiler errors" }
            if($txt -notmatch '0 warnings'){ throw "$label has compiler warnings" }
            if(-not (Test-Path $ex5)){ throw "$label EX5 missing" }
          }
          Compile-Mql $ea 'astra-ea'
          Compile-Mql $loader 'custom-loader'

      - name: Import one-year XAUUSD history
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:MT5_ROOT
          $mql5=Join-Path $root 'MQL5'
          Copy-Item 'mt5_input/ASTRA_XAUUSD_M1.csv' "$mql5\Files\ASTRA_XAUUSD_M1.csv" -Force

          $cfg=Join-Path $root 'astra-loader.ini'
          @'
          [Common]
          NewsEnable=0

          [Experts]
          Enabled=1
          AllowLiveTrading=0
          AllowDllImport=0

          [StartUp]
          Script=AUREON\AUREON_CustomSymbolLoader
          Symbol=EURUSD
          Period=M1
          ShutdownTerminal=1
          '@ | Set-Content -Path $cfg -Encoding Unicode

          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath "$root\terminal64.exe" -ArgumentList @('/portable',"/config:$cfg") -PassThru
          if(-not $p.WaitForExit(900000)){ $p.Kill(); throw 'One-year custom-symbol import timed out' }
          Start-Sleep -Seconds 3

          $events=''
          Get-ChildItem "$root\Logs","$mql5\Logs" -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            try { $events += (Get-Content $_.FullName -Raw -Encoding Unicode) + "`n" } catch {}
          }
          ($events -split "`n" | Where-Object { $_ -match 'ASTRA_IMPORT_' }) | Set-Content 'fast_artifact\import-events.log'
          if($events -notmatch 'ASTRA_IMPORT_OK'){ throw 'One-year ASTRA_XAUUSD import did not complete' }

      - name: Run one-year trade-discovery matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:MT5_ROOT
          $mql5=Join-Path $root 'MQL5'
          $profile=Join-Path $mql5 'Profiles\Tester'
          New-Item -ItemType Directory -Force -Path $profile,"$root\reports",'fast_artifact\reports' | Out-Null
          $cases=@(
            @{Name='E1'; Preset='ASTRA_GOLD_V1_E1_ONLY_OHLC.set'},
            @{Name='DISCOVERY'; Preset='ASTRA_GOLD_V1_DISCOVERY.set'},
            @{Name='E1_E3'; Preset='ASTRA_GOLD_V1_E1_E3_OHLC.set'},
            @{Name='E1_E5'; Preset='ASTRA_GOLD_V1_E1_E5_OHLC.set'},
            @{Name='PENDING'; Preset='ASTRA_GOLD_V1_PENDING_PRECISION_OHLC.set'}
          )

          foreach($case in $cases){
            Copy-Item ("ea/astra/presets/"+$case.Preset) (Join-Path $profile $case.Preset) -Force
            $cfg=Join-Path $root ("fast-"+$case.Name+".ini")
            $reportName="FAST_"+$case.Name
            $ini=@"
            [Common]
            Login=$($env:MT5_DEMO_LOGIN)
            Password=$($env:MT5_DEMO_PASSWORD)
            Server=$($env:MT5_DEMO_SERVER)
            KeepPrivate=0
            NewsEnable=0

            [Experts]
            Enabled=1
            AllowLiveTrading=0
            AllowDllImport=0

            [Tester]
            Expert=AUREON\AUREON_ASTRA_GOLD_CAMPAIGN_V1
            ExpertParameters=$($case.Preset)
            Symbol=ASTRA_XAUUSD
            Period=M5
            Login=$($env:MT5_DEMO_LOGIN)
            Deposit=10000
            Currency=USD
            Leverage=1:100
            Model=1
            ExecutionMode=0
            Optimization=0
            FromDate=2025.08.20
            ToDate=2026.08.20
            ForwardMode=0
            Report=\reports\$reportName
            ReplaceReport=1
            ShutdownTerminal=1
            UseLocal=1
            UseRemote=0
            UseCloud=0
            Visual=0
            "@
            $ini | Set-Content -Path $cfg -Encoding Unicode

            Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath "$root\terminal64.exe" -ArgumentList @('/portable',"/config:$cfg") -PassThru
            if(-not $p.WaitForExit(900000)){
              $p.Kill()
              Get-Process metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              throw ($case.Name+' tester timeout')
            }
            Start-Sleep -Seconds 3

            $report=Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like ($reportName+'*.htm') -or $_.Name -like ($reportName+'*.html') } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if(-not $report){ throw ($case.Name+' did not produce report') }
            Copy-Item $report.FullName ("fast_artifact\reports\"+$case.Name+".htm") -Force
          }

      - name: Analyze and compare
        shell: pwsh
        run: |
          foreach($name in @('E1','DISCOVERY','E1_E3','E1_E5','PENDING')){
            $out="fast_artifact\analysis\$name"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            python scripts/analyze_mt5_report.py ("fast_artifact\reports\"+$name+".htm") --out $out --min-trades 20 --min-pf 1.00 --max-dd 20.0
            Write-Host ($name+' analyzer exit='+$LASTEXITCODE)
          }
          python scripts/summarize_mt5_matrix.py 'fast_artifact\analysis' --out 'fast_artifact'
          'FAST_OHLC_MATRIX_COMPLETE' | Set-Content 'fast_artifact\status.txt'

      - name: Capture evidence
        if: always()
        shell: pwsh
        run: |
          git rev-parse HEAD | Set-Content 'fast_artifact\source_commit.txt'
          @(
            'SOURCE=DUKASCOPY_EXTERNAL',
            'TRANSPORT=PINNED_GITHUB_MIRROR',
            'MIRROR_COMMIT=922f83a60cc574e7395fb27397077288055a1ef6',
            'VOLUME_FILTER=DISABLED_NO_TICK_VOLUME',
            'MODEL=1_MINUTE_OHLC',
            'FROM=2025-08-20',
            'TO=2026-08-20',
            'LIVE_TRADING=DISABLED'
          ) | Set-Content 'fast_artifact\research_context.txt'
          Copy-Item 'research_data\XAUUSD\download_manifest.json' 'fast_artifact\download_manifest.json' -ErrorAction SilentlyContinue
          Get-ChildItem "$env:MT5_ROOT\Tester\logs","$env:MT5_ROOT\MQL5\Logs" -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $safe=($_.FullName -replace '[:\\/]','_')
            Copy-Item $_.FullName ("fast_artifact\"+$safe) -Force
          }

      - name: Upload fast research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-fast-ohlc-${{ github.run_id }}
          path: fast_artifact
          retention-days: 30
          if-no-files-found: warn
