name: V2.12 A01 Edge Recovery Tournament

on:
  workflow_dispatch:
  push:
    branches: [research/v212-edge-recovery-20261011]
    paths:
      - 'research/requests/v212-a01-edge-recovery-20261012.json'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  XAU_MIRROR_COMMIT: '922f83a60cc574e7395fb27397077288055a1ef6'
  RESEARCH_START: '2025-08-21'
  RESEARCH_END: '2026-08-20'

jobs:
  tests:
    name: A01 TDD and frozen-control gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r research/requirements.txt pytest
      - name: Run V2.12 A01 tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            research/tests/test_v212_control_manifest.py \
            research/tests/test_fvg_v212_edge_recovery.py \
            research/tests/test_v212_a01_metrics.py \
            research/tests/test_run_v212_a01.py \
            -v | tee a01-test-output.txt
      - name: Build and verify actual frozen-control manifest
        shell: bash
        run: |
          set -euo pipefail
          python research/v212_control_manifest.py --out v212_control_integrity.json
          python - <<'PY'
          import json
          m=json.load(open('v212_control_integrity.json',encoding='utf-8'))
          expected={
            'InpOneTradePerFVG':'false','InpCooldownSeconds':'0','InpRequireRejection':'true',
            'InpMinFVG_ATR':'0.15','InpMinBody_ATR':'0.5','InpUseProfitLock':'true',
            'InpUseATRTrail':'true','InpTrail_ATR':'0.1'
          }
          bad={k:(m['preset'].get(k),v) for k,v in expected.items() if m['preset'].get(k)!=v}
          assert not bad, bad
          assert m['control']=='FVG_V2_12_R943K'
          assert m['baseline_role']=='FROZEN_CONTROL'
          assert m['native_model']=='Every tick based on real ticks'
          assert m['native_reproduction_status']=='PENDING'
          assert m['live_ready'] is False
          assert m['real_money_execution']=='LOCKED'
          assert m['benchmark']['r943k']['profit_factor']==2.58
          assert m['benchmark']['r1_253b']['profit_factor']==2.48
          for key in ('ea_sha256','preset_sha256','r943k_sha256','r1_253b_sha256'):
              assert isinstance(m[key],str) and len(m[key])==64
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a01-test-gate-${{ github.run_id }}
          path: |
            a01-test-output.txt
            v212_control_integrity.json
          retention-days: 30
          if-no-files-found: error

  a01:
    name: A01 causal recycling attribution
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r research/requirements.txt pytest
      - uses: actions/download-artifact@v4
        with:
          name: a01-test-gate-${{ github.run_id }}
          path: gate
      - name: Restore pinned one-year M1 cache
        uses: actions/cache@v4
        with:
          path: research_data/XAUUSD/M1
          key: v212-a01-${{ env.XAU_MIRROR_COMMIT }}-${{ env.RESEARCH_START }}-${{ env.RESEARCH_END }}-v1
      - name: Import pinned XAUUSD M1 bid/ask history
        run: >-
          python research/mirror_m1.py
          --start '${{ env.RESEARCH_START }}'
          --end '${{ env.RESEARCH_END }}'
          --commit '${{ env.XAU_MIRROR_COMMIT }}'
          --output research_data
      - name: Verify dataset provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('research_data/XAUUSD/download_manifest.json')
          assert p.is_file() and p.stat().st_size>0
          m=json.loads(p.read_text())
          assert m['mirror_commit']=='922f83a60cc574e7395fb27397077288055a1ef6'
          assert m['requested_start']=='2025-08-21'
          assert m['requested_end']=='2026-08-20'
          assert isinstance(m['dataset_sha256'],str) and len(m['dataset_sha256'])==64
          assert int(m['m1_rows'])>100000
          PY
      - name: Run A01 attribution twice for deterministic agreement
        shell: bash
        run: |
          set -euo pipefail
          python research/run_v212_a01.py \
            --data research_data/XAUUSD/M1 \
            --manifest research_data/XAUUSD/download_manifest.json \
            --out research_results/run1 \
            --source-commit "$GITHUB_SHA"
          python research/run_v212_a01.py \
            --data research_data/XAUUSD/M1 \
            --manifest research_data/XAUUSD/download_manifest.json \
            --out research_results/run2 \
            --source-commit "$GITHUB_SHA"
      - name: Verify deterministic rerun and fail-closed labels
        shell: bash
        run: |
          set -euo pipefail
          for f in comparison.csv attempt_breakdown.csv year_breakdown.csv direction_breakdown.csv exit_breakdown.csv attribution.json provenance.json; do
            cmp "research_results/run1/$f" "research_results/run2/$f"
          done
          for v in A01_CONTROL A01_ONE_TRADE A01_COOLDOWN_1BAR A01_MAX3; do
            cmp "research_results/run1/trades_${v}.csv" "research_results/run2/trades_${v}.csv"
          done
          python - <<'PY'
          import hashlib, json, pathlib
          r=json.loads(pathlib.Path('research_results/run1/attribution.json').read_text())
          assert set(r['variants'])=={'A01_CONTROL','A01_ONE_TRADE','A01_COOLDOWN_1BAR','A01_MAX3'}
          assert r['fidelity']=='M1_BAR_APPROX_CAUSAL_NEXT_BAR_ENTRY'
          assert r['native_parity_status']=='PENDING'
          assert r['external_holdout_status']=='PENDING'
          assert r['promotion_status']=='RESEARCH_ONLY'
          assert r['data_role']=='historical_diagnostic'
          assert r['compounding'] is False
          assert r.get('untouched_holdout_pass') is not True
          p=r['provenance']
          assert p['dataset_sha256'] and len(p['dataset_sha256'])==64
          assert p['mirror_commit']=='922f83a60cc574e7395fb27397077288055a1ef6'
          assert p['source_commit']
          files=[]
          for f in sorted(pathlib.Path('research_results/run1').glob('*')):
              if f.is_file():
                  files.append({'file':f.name,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          pathlib.Path('deterministic_evidence.json').write_text(json.dumps({'agreement':'EXACT','files':files},indent=2))
          PY
      - name: Package A01 evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          cp -r research_results/run1 artifact/results 2>/dev/null || true
          cp research_data/XAUUSD/download_manifest.json artifact/dataset_manifest.json 2>/dev/null || true
          cp gate/a01-test-output.txt artifact/test-output.txt 2>/dev/null || true
          cp gate/v212_control_integrity.json artifact/v212_control_integrity.json 2>/dev/null || true
          cp deterministic_evidence.json artifact/deterministic_evidence.json 2>/dev/null || true
          cp research/requests/v212-a01-edge-recovery-20261012.json artifact/request.json 2>/dev/null || true
          git rev-parse HEAD > artifact/source_commit.txt
      - name: Upload A01 research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AUREON-V212-A01-EDGE-RECOVERY-${{ github.run_id }}
          path: artifact
          retention-days: 30
          if-no-files-found: error
