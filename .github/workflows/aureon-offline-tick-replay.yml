name: AUREON Offline XAUUSD Tick Audit and Research Replay

on:
  workflow_dispatch:
  push:
    paths:
      - research/tools/offline_tick_replay.py
      - .github/workflows/aureon-offline-tick-replay.yml
    branches:
      - research/xauusd-strategy-suite-20261021
      - research/market-context-execution-audit-20261021

permissions:
  contents: read

jobs:
  audit-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow
      - name: Download and verify published tick archive
        run: |
          curl --fail --location --retry 3 --output xauusd-ticks-2026-10.zip "https://github.com/jerryllee421-lab/aureon-omega/releases/download/xauusd-dukascopy-ticks-2026-10-01-to-2026-10-20-6439b55/xauusd-ticks-2026-10.zip"
          echo "d354c8769bd4d6f6c5a57a7da87843acdddec4f03815137b339c6ed5786069b0  xauusd-ticks-2026-10.zip" | sha256sum --check
      - name: Inspect archive layout
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("xauusd-ticks-2026-10.zip") as z:
              for x in z.infolist()[:300]:
                  print(f"{x.file_size}\t{x.filename}")
              print("TOTAL_MEMBERS", len(z.infolist()))
          PY
      - name: Audit archive and replay strategies
        env:
          TICK_ARCHIVE: xauusd-ticks-2026-10.zip
          EXPECTED_SHA256: d354c8769bd4d6f6c5a57a7da87843acdddec4f03815137b339c6ed5786069b0
        run: python research/tools/offline_tick_replay.py
      - name: Upload research report and trade ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aureon-offline-tick-research
          path: research-output/
          if-no-files-found: warn
          retention-days: 30
