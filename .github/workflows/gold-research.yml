name: AUREON Gold Research

on:
  workflow_dispatch:
    inputs:
      years:
        description: Years of pinned XAUUSD history
        required: true
        default: '5'
        type: choice
        options: ['1','2','3','5']
      timeframe:
        description: Research timeframe
        required: true
        default: M5
        type: choice
        options: [M1,M5,M15,H1,H4]
      max_candidates:
        description: Maximum parameter candidates
        required: true
        default: '120'
        type: string
  push:
    branches: [main]
    paths:
      - 'research/requests/*.json'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  XAU_MIRROR_END: '2026-08-20'
  XAU_MIRROR_COMMIT: '922f83a60cc574e7395fb27397077288055a1ef6'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - name: Resolve research request
        id: request
        shell: bash
        env:
          EVENT_NAME: '${{ github.event_name }}'
          MANUAL_YEARS: '${{ inputs.years }}'
          MANUAL_TIMEFRAME: '${{ inputs.timeframe }}'
          MANUAL_MAX_CANDIDATES: '${{ inputs.max_candidates }}'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          from pathlib import Path

          event = os.environ['EVENT_NAME']
          if event == 'workflow_dispatch':
              request = {
                  'id': f'manual-{os.environ.get("GITHUB_RUN_ID", "unknown")}',
                  'years': os.environ['MANUAL_YEARS'],
                  'timeframe': os.environ['MANUAL_TIMEFRAME'],
                  'max_candidates': os.environ['MANUAL_MAX_CANDIDATES'],
              }
              request_file = ''
          elif event == 'push':
              out = subprocess.check_output(
                  ['git','diff-tree','--no-commit-id','--name-only','-r',os.environ['GITHUB_SHA'],'--','research/requests'],
                  text=True,
              )
              candidates = [line.strip() for line in out.splitlines() if line.strip().endswith('.json')]
              if len(candidates) != 1:
                  raise SystemExit(f'Expected exactly one research request JSON in push, found {len(candidates)}: {candidates}')
              request_file = candidates[0]
              request = json.loads(Path(request_file).read_text(encoding='utf-8'))
          else:
              raise SystemExit(f'Unsupported event: {event}')

          years = str(request.get('years',''))
          timeframe = str(request.get('timeframe','')).upper()
          raw_candidates = str(request.get('max_candidates',''))
          request_id = str(request.get('id','')).strip()

          if years not in {'1','2','3','5'}:
              raise SystemExit(f'Invalid years: {years}')
          if timeframe not in {'M1','M5','M15','H1','H4'}:
              raise SystemExit(f'Invalid timeframe: {timeframe}')
          try:
              max_candidates = int(raw_candidates)
          except ValueError:
              raise SystemExit(f'Invalid max_candidates: {raw_candidates}')
          if not 1 <= max_candidates <= 500:
              raise SystemExit('max_candidates must be between 1 and 500')
          if not request_id or len(request_id) > 96 or not all(c.isalnum() or c in '-_.' for c in request_id):
              raise SystemExit('request id must be 1-96 chars using letters, digits, dash, underscore, or dot')

          print(f'id={request_id}')
          print(f'years={years}')
          print(f'timeframe={timeframe}')
          print(f'max_candidates={max_candidates}')
          print(f'file={request_file}')
          PY
      - name: Resolve pinned UTC research range
        id: dates
        shell: bash
        env:
          YEARS: '${{ steps.request.outputs.years }}'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date
          y=int(os.environ['YEARS'])
          end=date.fromisoformat('${{ env.XAU_MIRROR_END }}')
          try: start=end.replace(year=end.year-y)
          except ValueError: start=end.replace(month=2,day=28,year=end.year-y)
          print(f"start={start.isoformat()}")
          print(f"end={end.isoformat()}")
          PY
      - name: Restore pinned XAUUSD cache
        uses: actions/cache@v4
        with:
          path: research_data/XAUUSD/M1
          key: xau-mirror-${{ env.XAU_MIRROR_COMMIT }}-${{ steps.dates.outputs.start }}-${{ steps.dates.outputs.end }}-v2
      - name: Import pinned XAUUSD M1 bid and ask history
        run: >-
          python research/mirror_m1.py
          --start '${{ steps.dates.outputs.start }}'
          --end '${{ steps.dates.outputs.end }}'
          --commit '${{ env.XAU_MIRROR_COMMIT }}'
      - name: Build and validate 21 standard timeframes
        run: python research/resample_validate.py --root research_data --symbol XAUUSD
      - name: Run FVG V2.11 research
        run: >-
          python research/run_research.py
          --data 'research_data/XAUUSD/canonical/XAUUSD_${{ steps.request.outputs.timeframe }}.parquet'
          --max-candidates '${{ steps.request.outputs.max_candidates }}'
      - name: Package manifest
        if: always()
        run: |
          mkdir -p artifact
          cp -r research_results artifact/ 2>/dev/null || true
          cp research_data/XAUUSD/*manifest.json artifact/ 2>/dev/null || true
          cp research/config/fvg_v211_baseline.yml artifact/ 2>/dev/null || true
          if [ -n '${{ steps.request.outputs.file }}' ] && [ -f '${{ steps.request.outputs.file }}' ]; then
            cp '${{ steps.request.outputs.file }}' artifact/request.json
          fi
          git rev-parse HEAD > artifact/source_commit.txt
          printf '%s\n' '${{ steps.request.outputs.id }}' > artifact/request_id.txt
      - name: Upload research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aureon-gold-${{ steps.request.outputs.timeframe }}-${{ steps.request.outputs.id }}-${{ github.run_id }}
          path: artifact
          retention-days: 30
          if-no-files-found: warn
