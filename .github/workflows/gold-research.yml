name: AUREON Gold Research

on:
  push:
    branches: [feature/gold-research-lab]
    paths:
      - 'research/**'
      - 'ea/**'
      - '.github/workflows/gold-research.yml'
  workflow_dispatch:
    inputs:
      years:
        description: Years of XAUUSD history
        required: true
        default: '5'
        type: choice
        options: ['1','2','3','5']
      timeframe:
        description: Research timeframe
        required: true
        default: M5
        type: choice
        options: [M1,M5,M15,H1,H4]
      max_candidates:
        description: Maximum parameter candidates
        required: true
        default: '120'
        type: string

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - name: Resolve UTC date range
        id: dates
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date
          raw='${{ inputs.years }}' or '5'; y=int(raw); end=date.today()
          try: start=end.replace(year=end.year-y)
          except ValueError: start=end.replace(month=2,day=28,year=end.year-y)
          print(f"start={start.isoformat()}")
          print(f"end={end.isoformat()}")
          PY
      - name: Restore Dukascopy raw cache
        uses: actions/cache@v4
        with:
          path: .cache/dukascopy
          key: duka-xauusd-${{ steps.dates.outputs.start }}-${{ steps.dates.outputs.end }}-v1
          restore-keys: |
            duka-xauusd-
      - name: Download authentic external XAUUSD M1 bid and ask bars
        run: python research/duka_m1.py --symbol XAUUSD --start '${{ steps.dates.outputs.start }}' --end '${{ steps.dates.outputs.end }}' --workers 12
      - name: Build and validate 21 standard timeframes
        run: python research/resample_validate.py --root research_data --symbol XAUUSD
      - name: Run FVG V2.11 research
        run: python research/run_research.py --data 'research_data/XAUUSD/canonical/XAUUSD_${{ inputs.timeframe || 'M1' }}.parquet' --max-candidates '${{ inputs.max_candidates || '240' }}'
      - name: Package manifest
        if: always()
        run: |
          mkdir -p artifact
          cp -r research_results artifact/ 2>/dev/null || true
          cp research_data/XAUUSD/*manifest.json artifact/ 2>/dev/null || true
          cp research/config/fvg_v211_baseline.yml artifact/ 2>/dev/null || true
          git rev-parse HEAD > artifact/source_commit.txt
      - name: Upload research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aureon-gold-${{ inputs.timeframe || 'M1' }}-${{ github.run_id }}
          path: artifact
          retention-days: 30
          if-no-files-found: warn
