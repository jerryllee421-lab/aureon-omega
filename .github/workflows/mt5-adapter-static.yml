name: MT5 Adapter and Ollama Static Validation

on:
  push:
    paths:
      - "mt5-adapter/**"
      - ".github/workflows/mt5-adapter-static.yml"
  pull_request:
    paths:
      - "mt5-adapter/**"
      - ".github/workflows/mt5-adapter-static.yml"
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python adapter and local AI analyst
        run: |
          python -m py_compile mt5-adapter/adapter.py
          python -m py_compile mt5-adapter/ollama_intelligence.py
      - name: Validate JSON configurations
        run: |
          python -m json.tool mt5-adapter/config/mt5_adapter.json
          python -m json.tool mt5-adapter/config/ollama_config.json
      - name: Validate requirements and setup assets
        run: |
          test -s mt5-adapter/requirements.txt
          test -s mt5-adapter/AUREON_ONE_CLICK_FULL_SETUP.cmd
          test -s mt5-adapter/AUREON_OLLAMA_CONTROL_CENTER.cmd
          test -s mt5-adapter/OLLAMA_RESEARCH_GUIDE.md
