name: AUREON MT5 Cloud Toolchain Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mt5-toolchain:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"

      - name: Install isolated MT5 toolchain
        shell: pwsh
        run: |
          $mt5 = "C:\AUREON_MT5"
          New-Item -ItemType Directory -Force -Path $mt5 | Out-Null
          $p = Start-Process "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList "/auto","/path:$mt5" -PassThru
          if (-not $p.WaitForExit(300000)) {
            try { Stop-Process -Id $p.Id -Force } catch {}
            throw "MT5 installer timeout"
          }
          if (-not (Test-Path "$mt5\terminal64.exe")) { throw "terminal64.exe missing" }
          if (-not (Test-Path "$mt5\metaeditor64.exe")) { throw "metaeditor64.exe missing" }

      - name: Compile deterministic smoke EA
        shell: pwsh
        run: |
          $src = @'
          #property strict
          #property version "1.00"
          int OnInit()
            {
             Print("AUREON_CLOUD_TOOLCHAIN_OK");
             return(INIT_SUCCEEDED);
            }
          void OnTick() {}
          '@
          $ea = "C:\AUREON_MT5\MQL5\Experts\AUREON_CLOUD_TOOLCHAIN_SMOKE.mq5"
          $log = "$env:RUNNER_TEMP\compile.log"
          [IO.File]::WriteAllText($ea,$src,(New-Object Text.UTF8Encoding($false)))
          Start-Process "C:\AUREON_MT5\metaeditor64.exe" -ArgumentList "/compile:$ea","/log:$log" -Wait
          Get-Content $log
          $text = Get-Content $log -Raw
          if ($text -notmatch "0 errors, 0 warnings") {
            throw "MetaEditor cloud compile failed"
          }

      - name: Package compile evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\aureon-toolchain" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\compile.log" "$env:RUNNER_TEMP\aureon-toolchain\compile.log" -ErrorAction SilentlyContinue
          Copy-Item "C:\AUREON_MT5\MQL5\Experts\AUREON_CLOUD_TOOLCHAIN_SMOKE.mq5" "$env:RUNNER_TEMP\aureon-toolchain\" -ErrorAction SilentlyContinue
          Copy-Item "C:\AUREON_MT5\MQL5\Experts\AUREON_CLOUD_TOOLCHAIN_SMOKE.ex5" "$env:RUNNER_TEMP\aureon-toolchain\" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AUREON-MT5-CLOUD-TOOLCHAIN
          path: ${{ runner.temp }}\aureon-toolchain
          retention-days: 7
          if-no-files-found: warn
