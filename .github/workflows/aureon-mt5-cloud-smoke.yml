name: AUREON MT5 Cloud Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aureon-mt5-cloud-smoke.yml'

jobs:
  mt5-cloud-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MT5_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
      MT5_SERVER: PXBTTrading-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) { $missing += "MT5_DEMO_LOGIN" }
          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) { $missing += "MT5_DEMO_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) { $missing += "MT5_SERVER" }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions secrets: $($missing -join ', ')"
          }

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $url = "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          Get-Item "$env:RUNNER_TEMP\mt5setup.exe"

      - name: Install MT5 portable cloud instance
        shell: pwsh
        run: |
          $mt5 = "C:\AUREON_MT5"
          New-Item -ItemType Directory -Force -Path $mt5 | Out-Null
          $p = Start-Process "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList "/auto","/path:$mt5" -PassThru
          if (-not $p.WaitForExit(300000)) {
            try { Stop-Process -Id $p.Id -Force } catch {}
            throw "MT5 installer timeout"
          }
          if (-not (Test-Path "$mt5\terminal64.exe")) {
            throw "terminal64.exe was not installed"
          }
          if (-not (Test-Path "$mt5\metaeditor64.exe")) {
            throw "metaeditor64.exe was not installed"
          }

      - name: Create broker login smoke configuration
        shell: pwsh
        run: |
          $cfg = @"
          [Common]
          Login=$env:MT5_LOGIN
          Password=$env:MT5_PASSWORD
          Server=$env:MT5_SERVER
          KeepPrivate=0
          NewsEnable=0
          CertInstall=1

          [Experts]
          Enabled=0
          AllowLiveTrading=0
          AllowDllImport=0
          "@
          [IO.File]::WriteAllText("C:\AUREON_MT5\config\aureon_cloud_smoke.ini",$cfg,(New-Object Text.UTF8Encoding($false)))

      - name: Start MT5 and verify broker authorization
        shell: pwsh
        run: |
          $terminal = "C:\AUREON_MT5\terminal64.exe"
          $config = "C:\AUREON_MT5\config\aureon_cloud_smoke.ini"
          $p = Start-Process $terminal -ArgumentList "/portable","/config:$config" -PassThru

          Start-Sleep -Seconds 90

          try {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          } catch {}

          $logs = Get-ChildItem "C:\AUREON_MT5\logs" -File -Filter "*.log" -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime
          if (-not $logs) { throw "No MT5 terminal logs were produced" }

          $text = ($logs | ForEach-Object { Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue }) -join "`n"
          $sanitized = $text -replace [regex]::Escape($env:MT5_PASSWORD),"***"

          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\aureon-smoke" | Out-Null
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\aureon-smoke\terminal.log",$sanitized)

          if ($text -notmatch "(?i)authorized") {
            throw "MT5 cloud runner did not confirm broker authorization. Inspect uploaded terminal log."
          }

          "MT5 broker authorization detected."

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AUREON-MT5-CLOUD-SMOKE
          path: ${{ runner.temp }}\aureon-smoke
          if-no-files-found: warn
          retention-days: 7
