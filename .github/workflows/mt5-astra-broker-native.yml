name: ASTRA Broker-Native Gold Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - feature/astra-campaign-ea-v1
    paths:
      - 'research/requests/astra-broker-native.json'

permissions:
  contents: read

env:
  MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
  MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
  MT5_DEMO_SERVER: PXBTTrading-1
  MT5_INSTALLER_URL: https://download.terminal.free/cdn/web/pxbt.trading.ltd/mt5/pxbttrading5setup.exe
  BROKER_SYMBOL: XAUUSD.ecn
  TEST_FROM: '2026.01.01'
  TEST_TO: '2026.09.22'

jobs:
  broker-native-baseline:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Require secure demo account context
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:MT5_DEMO_LOGIN) -or
             [string]::IsNullOrWhiteSpace($env:MT5_DEMO_PASSWORD)){
            throw 'MT5 demo login/password Actions secrets are required.'
          }
          Write-Host ("Broker-native validation server: "+$env:MT5_DEMO_SERVER)
          Write-Host ("Requested symbol: "+$env:BROKER_SYMBOL)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install official MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\AUREON_MT5_BROKER'
          $installer=Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri $env:MT5_INSTALLER_URL -OutFile $installer
          if((Get-Item $installer).Length -lt 100000){ throw 'MT5 installer download is unexpectedly small' }
          $p=Start-Process -FilePath $installer -ArgumentList @('/auto',"/path:$root") -PassThru
          if(-not $p.WaitForExit(600000)){ $p.Kill(); throw 'MT5 installer timed out' }
          $deadline=(Get-Date).AddMinutes(3)
          while((Get-Date) -lt $deadline -and -not (Test-Path "$root\metaeditor64.exe")){ Start-Sleep -Seconds 2 }
          if(-not (Test-Path "$root\metaeditor64.exe")){ throw 'MetaEditor missing after install' }

          & "$root\terminal64.exe" /portable
          Start-Sleep -Seconds 8
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "MT5_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile ASTRA EA and broker probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:MT5_ROOT
          $mql5=Join-Path $root 'MQL5'
          $eaDir=Join-Path $mql5 'Experts\AUREON'
          $scriptDir=Join-Path $mql5 'Scripts\AUREON'
          New-Item -ItemType Directory -Force -Path $eaDir,$scriptDir,'broker_artifact' | Out-Null
          $ea=Join-Path $eaDir 'AUREON_ASTRA_GOLD_CAMPAIGN_V1.mq5'
          $probe=Join-Path $scriptDir 'AUREON_BrokerSymbolProbe.mq5'
          Copy-Item 'ea/astra/AUREON_ASTRA_GOLD_CAMPAIGN_V1.mq5' $ea -Force
          Copy-Item 'ea/astra/tools/AUREON_BrokerSymbolProbe.mq5' $probe -Force

          function Compile-Mql([string]$source,[string]$label){
            $meta=Join-Path $root 'metaeditor64.exe'
            $p=Start-Process -FilePath $meta -ArgumentList @("/compile:$source","/include:$mql5",'/log') -PassThru
            if(-not $p.WaitForExit(180000)){ $p.Kill(); throw "$label compile timeout" }
            Start-Sleep -Seconds 2
            $log=[IO.Path]::ChangeExtension($source,'.log')
            $ex5=[IO.Path]::ChangeExtension($source,'.ex5')
            if(-not (Test-Path $log)){ throw "$label compile log missing" }
            $txt=Get-Content $log -Raw -Encoding Unicode
            $txt | Out-File ("broker_artifact\"+$label+"-compile.log") -Encoding utf8
            if($txt -notmatch '0 errors'){ throw "$label compiler errors" }
            if($txt -notmatch '0 warnings'){ throw "$label compiler warnings" }
            if(-not (Test-Path $ex5)){ throw "$label EX5 missing" }
          }

          Compile-Mql $ea 'astra-ea'
          Compile-Mql $probe 'broker-probe'
          Copy-Item ([IO.Path]::ChangeExtension($ea,'.ex5')) 'broker_artifact\AUREON_ASTRA_GOLD_CAMPAIGN_V1.ex5'
          (Get-FileHash $ea -Algorithm SHA256).Hash | Set-Content 'broker_artifact\ea.sha256'

      - name: Probe PrimeXBT XAUUSD symbol
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:MT5_ROOT
          $mql5=Join-Path $root 'MQL5'
          $cfg=Join-Path $root 'broker-probe.ini'
          $ini=@"
          [Common]
          Login=$($env:MT5_DEMO_LOGIN)
          Password=$($env:MT5_DEMO_PASSWORD)
          Server=$($env:MT5_DEMO_SERVER)
          KeepPrivate=0
          NewsEnable=0

          [Experts]
          Enabled=1
          AllowLiveTrading=0
          AllowDllImport=0

          [StartUp]
          Script=AUREON\AUREON_BrokerSymbolProbe
          Symbol=$($env:BROKER_SYMBOL)
          Period=M1
          ShutdownTerminal=1
          "@
          $ini | Set-Content -Path $cfg -Encoding Unicode

          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath "$root\terminal64.exe" -ArgumentList @('/portable',"/config:$cfg") -PassThru
          if(-not $p.WaitForExit(300000)){ $p.Kill(); throw 'Broker symbol probe timed out' }
          Start-Sleep -Seconds 3

          $events=''
          Get-ChildItem "$root\Logs","$mql5\Logs" -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            try { $events += (Get-Content $_.FullName -Raw -Encoding Unicode) + "`n" } catch {}
          }
          ($events -split "`n" | Where-Object { $_ -match 'ASTRA_BROKER_PROBE_' }) |
            Set-Content 'broker_artifact\broker-probe.log'
          ($events -split "`n" | Where-Object { $_ -match 'ASTRA_BROKER_PROBE_' }) |
            ForEach-Object { Write-Host $_ }
          if($events -notmatch 'ASTRA_BROKER_PROBE_OK'){ throw 'PrimeXBT XAUUSD broker symbol probe failed' }

      - name: Run broker-native baseline and discovery tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:MT5_ROOT
          $mql5=Join-Path $root 'MQL5'
          $profile=Join-Path $mql5 'Profiles\Tester'
          New-Item -ItemType Directory -Force -Path $profile,"$root\reports",'broker_artifact\reports' | Out-Null

          $cases=@(
            @{Name='E1_BASELINE'; Preset='ASTRA_GOLD_V1_E1_ONLY.set'},
            @{Name='DISCOVERY'; Preset='ASTRA_GOLD_V1_DISCOVERY.set'},
            @{Name='E1_E3'; Preset='ASTRA_GOLD_V1_E1_E3.set'},
            @{Name='E1_E5'; Preset='ASTRA_GOLD_V1_E1_E5.set'},
            @{Name='PENDING_PRECISION'; Preset='ASTRA_GOLD_V1_PENDING_PRECISION.set'}
          )

          foreach($case in $cases){
            Copy-Item ("ea/astra/presets/"+$case.Preset) (Join-Path $profile $case.Preset) -Force
            $cfg=Join-Path $root ("broker-"+$case.Name+".ini")
            $reportName="BROKER_"+$case.Name
            $ini=@"
            [Common]
            Login=$($env:MT5_DEMO_LOGIN)
            Password=$($env:MT5_DEMO_PASSWORD)
            Server=$($env:MT5_DEMO_SERVER)
            KeepPrivate=0
            NewsEnable=0

            [Experts]
            Enabled=1
            AllowLiveTrading=0
            AllowDllImport=0

            [Tester]
            Expert=AUREON\AUREON_ASTRA_GOLD_CAMPAIGN_V1
            ExpertParameters=$($case.Preset)
            Symbol=$($env:BROKER_SYMBOL)
            Period=M5
            Login=$($env:MT5_DEMO_LOGIN)
            Deposit=10000
            Currency=USD
            Leverage=1:100
            Model=1
            ExecutionMode=0
            Optimization=0
            OptimizationCriterion=6
            FromDate=$($env:TEST_FROM)
            ToDate=$($env:TEST_TO)
            ForwardMode=0
            Report=\reports\$reportName
            ReplaceReport=1
            ShutdownTerminal=1
            UseLocal=1
            UseRemote=0
            UseCloud=0
            Visual=0
            "@
            $ini | Set-Content -Path $cfg -Encoding Unicode

            Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath "$root\terminal64.exe" -ArgumentList @('/portable',"/config:$cfg") -PassThru
            if(-not $p.WaitForExit(1200000)){
              $p.Kill()
              Get-Process metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              throw ($case.Name+' broker-native test timed out')
            }
            Start-Sleep -Seconds 3

            $report=Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like ($reportName+'*.htm') -or $_.Name -like ($reportName+'*.html') } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if(-not $report){ throw ($case.Name+' did not produce report') }
            Copy-Item $report.FullName ("broker_artifact\reports\"+$case.Name+".htm") -Force
            Write-Host ($case.Name+' report bytes='+$report.Length)
          }

      - name: Analyze broker-native reports
        shell: pwsh
        run: |
          foreach($name in @('E1_BASELINE','DISCOVERY','E1_E3','E1_E5','PENDING_PRECISION')){
            $out="broker_artifact\analysis\$name"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            python scripts/analyze_mt5_report.py ("broker_artifact\reports\"+$name+".htm") --out $out --min-trades 20 --min-pf 1.00 --max-dd 20.0
            $code=$LASTEXITCODE
            Write-Host ($name+' analyzer exit='+$code)
          }
          'BROKER_NATIVE_BASELINE_COMPLETE' | Set-Content 'broker_artifact\status.txt'

      - name: Capture broker/tester diagnostics
        if: always()
        shell: pwsh
        run: |
          $root=$env:MT5_ROOT
          if(-not (Test-Path 'broker_artifact')){ New-Item -ItemType Directory -Path 'broker_artifact' | Out-Null }
          Get-ChildItem "$root\Logs","$root\Tester\logs","$root\MQL5\Logs" -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              $body=Get-Content $_.FullName -Raw -Encoding Unicode
              if($body -match 'Tester|ASTRA|XAUUSD|history|trade server|error|failed'){
                $safe=($_.FullName -replace '[:\\/]','_')
                $body | Out-File ("broker_artifact\"+$safe) -Encoding utf8
              }
            } catch {}
          }
          @(
            'SYMBOL=XAUUSD.ecn',
            'PERIOD=M5',
            'MODEL=1_MINUTE_OHLC',
            'FROM=2026-01-01',
            'TO=2026-09-22',
            'DEPOSIT=10000',
            'LEVERAGE=1:100',
            'LIVE_TRADING=DISABLED'
          ) | Set-Content 'broker_artifact\context.txt'
          git rev-parse HEAD | Set-Content 'broker_artifact\source_commit.txt'

      - name: Upload broker-native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-broker-native-${{ github.run_id }}
          path: broker_artifact
          retention-days: 30
          if-no-files-found: warn
