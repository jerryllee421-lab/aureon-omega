name: AUREON V3 Bootstrap and Decade Research

on:
  push:
    branches:
      - feature/v3-profit-hunter-native
    paths:
      - '.v3_bootstrap/v3_repo_bundle.tar.gz'
      - '.github/workflows/v3-bootstrap.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  XAU_MIRROR_COMMIT: '922f83a60cc574e7395fb27397077288055a1ef6'
  XAU_START: '2016-01-01'
  XAU_END: '2025-12-31'

jobs:
  bootstrap-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Expand exact tested V3 source bundle
        run: tar -xzf .v3_bootstrap/v3_repo_bundle.tar.gz -C .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Verify V3 contracts before data spend
        run: |
          python -m compileall -q research/v3_profit_hunter research/tests/v3_profit_hunter
          python -m pytest research/tests/v3_profit_hunter -q
      - name: Restore pinned decade cache
        uses: actions/cache@v4
        with:
          path: research_data/XAUUSD/M1
          key: v3-xau-mirror-${{ env.XAU_MIRROR_COMMIT }}-${{ env.XAU_START }}-${{ env.XAU_END }}
      - name: Import pinned XAUUSD M1 Bid Ask decade
        run: >-
          python research/mirror_m1.py
          --start '${{ env.XAU_START }}'
          --end '${{ env.XAU_END }}'
          --commit '${{ env.XAU_MIRROR_COMMIT }}'
      - name: Build and validate canonical timeframes
        run: python research/resample_validate.py --root research_data --symbol XAUUSD
      - name: M1 data quality gate
        run: >-
          python research/gold_data_gate.py
          --input research_data/XAUUSD/canonical/XAUUSD_M1.parquet
          --out research_results/v3_profit_hunter/data_quality.json
      - name: Run V3 full decade campaign
        run: >-
          python -m research.v3_profit_hunter.cli full-campaign
          --experiment-id 'v3-decade-${{ github.run_id }}'
          --config research/v3_profit_hunter/config/tournament.yml
          --data research_data/XAUUSD/canonical/XAUUSD_M1.parquet
          --out research_results/v3_profit_hunter/final
      - name: Package research evidence
        if: always()
        run: |
          mkdir -p artifact
          cp -r research_results/v3_profit_hunter artifact/ 2>/dev/null || true
          cp research_data/XAUUSD/download_manifest.json artifact/ 2>/dev/null || true
          cp research_data/XAUUSD/validation_manifest.json artifact/ 2>/dev/null || true
          sha256sum ea/baseline/FVG_Scalper_V2_17_FORWARD_VALIDATION.mq5 > artifact/v217-source.sha256
          git rev-parse HEAD > artifact/bootstrap_source_commit.txt
      - name: Upload decade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aureon-v3-decade-${{ github.run_id }}
          path: artifact
          retention-days: 30
          if-no-files-found: warn
      - name: Commit expanded V3 implementation to feature branch
        if: success()
        shell: bash
        run: |
          rm -f .v3_bootstrap/v3_repo_bundle.tar.gz .github/workflows/v3-bootstrap.yml
          rmdir .v3_bootstrap 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: implement V3 Profit Hunter research stack'
          git push origin HEAD:feature/v3-profit-hunter-native
