name: AUREON Strategy Suite MetaEditor Compile

concurrency:
  group: aureon-strategy-suite-compile-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches:
      - research/xauusd-strategy-suite-20261021
    paths:
      - 'ea/challengers/AUREON_XAUUSD_Strategy_Suite_RealTicks_v1.mq5'
      - 'scripts/mt5_linux_compile_strategy_suite.sh'
      - '.github/workflows/aureon-strategy-suite-compile.yml'
permissions:
  contents: read
env:
  WINEARCH: win64
  WINEDEBUG: -all
  MT5_INSTALLER_URL: https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe
  EA_SOURCE: ea/challengers/AUREON_XAUUSD_Strategy_Suite_RealTicks_v1.mq5
  EA_NAME: AUREON_XAUUSD_Strategy_Suite_RealTicks_v1.mq5
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine and headless display
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wine xvfb xauth cabextract winbind curl ca-certificates p7zip-full
          wine --version
      - name: Compile strategy suite with MetaEditor
        shell: bash
        run: bash scripts/mt5_linux_compile_strategy_suite.sh
      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aureon-strategy-suite-compile-${{ github.run_id }}
          path: mt5_ci_artifact
          retention-days: 30
          if-no-files-found: warn
