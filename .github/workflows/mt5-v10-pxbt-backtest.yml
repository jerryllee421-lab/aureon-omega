name: AUREON V10 MT5 PXBT 1Y Backtest

on:
  push:
    branches:
      - backtest/mt5-v10-mobile
    paths:
      - "mt5/**"
      - ".github/scripts/run-mt5-backtest.ps1"
      - ".github/workflows/mt5-v10-pxbt-backtest.yml"
      - ".github/mt5-backtest-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PXBT_LOGIN: ${{ secrets.PXBT_MT5_LOGIN }}
      PXBT_PASSWORD: ${{ secrets.PXBT_MT5_INVESTOR_PASSWORD }}
      PXBT_SERVER: ${{ secrets.PXBT_MT5_SERVER }}
      EA_BASENAME: AUREON_OMEGA_V10_AUTONOMOUS_HYPER_SCALPER
      TEST_FROM: "2025.10.04"
      TEST_TO: "2026.10.04"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run native MT5 backtest
        shell: pwsh
        run: ./.github/scripts/run-mt5-backtest.ps1

      - name: Upload MT5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AUREON-V10-PXBT-1Y-MT5
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
