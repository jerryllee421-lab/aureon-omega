name: AUREON Dukascopy Acquisition Diagnostics

on:
  push:
    branches: [feature/adaptive-prediction-engine]
    paths:
      - ".github/workflows/aureon-dukascopy-diagnostics.yml"
  workflow_dispatch:
    inputs:
      date_from:
        description: "Start date UTC (YYYY-MM-DD)"
        required: true
        default: "2024-10-20"
        type: string
      date_to:
        description: "End date UTC (YYYY-MM-DD)"
        required: true
        default: "2026-10-20"
        type: string

permissions:
  contents: read

concurrency:
  group: aureon-dukascopy-diagnostics
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate request and environment
        id: validate
        shell: bash
        env:
          DATE_FROM: ${{ inputs.date_from || '2024-10-20' }}
          DATE_TO: ${{ inputs.date_to || '2026-10-20' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import date
          import os, re
          a, b = os.environ["DATE_FROM"], os.environ["DATE_TO"]
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", a) or not re.fullmatch(r"\d{4}-\d{2}-\d{2}", b):
              raise SystemExit("Dates must use YYYY-MM-DD")
          start, end = date.fromisoformat(a), date.fromisoformat(b)
          if end < start or (end-start).days < 730:
              raise SystemExit("Require valid dates spanning at least 730 days")
          print(f"Requested UTC date span: {a} through {b}; {(end-start).days} elapsed days")
          PY
          python3 -m venv "$RUNNER_TEMP/duka-venv"
          "$RUNNER_TEMP/duka-venv/bin/python" -m pip install --upgrade pip dukascopy-downloader pyarrow
          "$RUNNER_TEMP/duka-venv/bin/duka" --help > "$RUNNER_TEMP/duka-help.txt" 2>&1
          "$RUNNER_TEMP/duka-venv/bin/duka" download --help > "$RUNNER_TEMP/duka-download-help.txt" 2>&1
          cat "$RUNNER_TEMP/duka-help.txt"
          cat "$RUNNER_TEMP/duka-download-help.txt"
          echo "date_from=$DATE_FROM" >> "$GITHUB_OUTPUT"
          echo "date_to=$DATE_TO" >> "$GITHUB_OUTPUT"

      - name: Probe a single bounded day and capture diagnostics
        id: probe
        shell: bash
        env:
          DATE_FROM: ${{ inputs.date_from || '2024-10-20' }}
        run: |
          set -u
          mkdir -p diagnostics probe-data
          python3 - "$DATE_FROM" <<'PY'
          from datetime import date, timedelta
          import sys
          d=date.fromisoformat(sys.argv[1])
          print((d+timedelta(days=1)).isoformat())
          PY
          DAY_END="$(python3 -c 'from datetime import date,timedelta; import os; print((date.fromisoformat(os.environ["DATE_FROM"])+timedelta(days=1)).isoformat())')"
          echo "Probe start UTC: $(date -u +%FT%TZ)" | tee diagnostics/probe-status.txt
          echo "Testing exactly one UTC calendar day: $DATE_FROM" | tee -a diagnostics/probe-status.txt
          set +e
          timeout --signal=TERM --kill-after=15s 12m "$RUNNER_TEMP/duka-venv/bin/duka" download XAUUSD --tf tick --from "$DATE_FROM" --to "$DATE_FROM" --side BOTH --data-dir "$PWD/probe-data" --rate 3 --retries 12 > diagnostics/downloader.log 2>&1
          rc=$?
          set -e
          echo "exit_code=$rc" | tee -a diagnostics/probe-status.txt
          echo "Probe end UTC: $(date -u +%FT%TZ)" | tee -a diagnostics/probe-status.txt
          find probe-data -type f -printf '%p %s bytes\n' > diagnostics/files.txt || true
          cat diagnostics/downloader.log
          if [[ "$rc" -eq 124 || "$rc" -eq 137 ]]; then
            echo "Downloader timed out during a one-day probe. Do not start a full two-year download until this is resolved." | tee -a diagnostics/probe-status.txt
            exit 1
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "Downloader failed during a one-day probe." | tee -a diagnostics/probe-status.txt
            exit "$rc"
          fi
          test -s diagnostics/downloader.log
          "$RUNNER_TEMP/duka-venv/bin/python" - "$PWD/probe-data" "$DATE_FROM" <<'PY'
          import json, sys
          from pathlib import Path
          import pyarrow.compute as pc
          import pyarrow.parquet as pq
          root, expected = Path(sys.argv[1]), sys.argv[2]
          files = sorted(root.rglob("*.parquet"))
          day_files = [p for p in files if p.stem == expected]
          if len(day_files) != 1:
              raise SystemExit(f"Expected exactly one daily Parquet for {expected}; found {[p.name for p in day_files]}")
          p = day_files[0]
          table = pq.read_table(p, columns=["time", "bid", "ask"])
          if table.num_rows <= 0:
              raise SystemExit("Probe produced zero ticks")
          for name in ("time", "bid", "ask"):
              if table[name].null_count:
                  raise SystemExit(f"Null values found in {name}")
          if pc.any(pc.less_equal(table["bid"], 0)).as_py() or pc.any(pc.less_equal(table["ask"], 0)).as_py():
              raise SystemExit("Non-positive bid/ask in probe")
          if pc.any(pc.less(table["ask"], table["bid"])).as_py():
              raise SystemExit("Ask below bid in probe")
          if table["time"].null_count:
              raise SystemExit("Null timestamps in probe")
          report = {"date_utc": expected, "file": str(p.relative_to(root)), "tick_rows": table.num_rows,
                    "schema": str(table.schema), "bid_ask_valid": True,
                    "first_timestamp": str(pc.min(table["time"]).as_py()),
                    "last_timestamp": str(pc.max(table["time"]).as_py())}
          Path("diagnostics/probe-validation.json").write_text(json.dumps(report, indent=2) + "\\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
          echo "Single-day download and quote sanity checks passed. Full coverage remains unproven." | tee -a diagnostics/probe-status.txt

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aureon-dukascopy-diagnostics-${{ github.run_id }}
          path: |
            diagnostics/
            probe-data/
            ${{ runner.temp }}/duka-help.txt
            ${{ runner.temp }}/duka-download-help.txt
          if-no-files-found: warn
          retention-days: 14
