version: 2.1

parameters:
  years:
    type: integer
    default: 5
  timeframe:
    type: string
    default: M1
  max_candidates:
    type: integer
    default: 240

jobs:
  gold-research:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    environment:
      PYTHONUNBUFFERED: "1"
      NVIDIA_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
    steps:
      - checkout
      - restore_cache:
          keys:
            - aureon-pip-v2-{{ checksum "research/requirements.txt" }}
            - aureon-pip-v2-
      - run:
          name: Install research dependencies
          command: |
            python -m pip install --user -r research/requirements.txt
      - save_cache:
          key: aureon-pip-v2-{{ checksum "research/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - restore_cache:
          keys:
            - aureon-duka-xauusd-v1-
      - run:
          name: Resolve research date range
          command: |
            python -c 'from datetime import date; y=int("<< pipeline.parameters.years >>"); end=date.today(); start=end.replace(year=end.year-y) if not (end.month==2 and end.day==29) else end.replace(month=2,day=28,year=end.year-y); print("export AUREON_START="+start.isoformat()); print("export AUREON_END="+end.isoformat())' > /tmp/aureon_dates
            cat /tmp/aureon_dates >> "$BASH_ENV"
      - run:
          name: Publish acquisition start
          command: |
            python research/status_event.py --state RUNNING --stage GOLD_BRAIN --task "Populate Gold Brain" --completed 0 --total 4
            python research/publish_telemetry.py status || true
      - run:
          name: Populate and integrity-gate Gold Brain
          command: |
            source "$BASH_ENV"
            python research/populate_gold_brain.py --start "$AUREON_START" --end "$AUREON_END" --root research_data --workers 12 --brain-tf M1
          no_output_timeout: 30m
      - save_cache:
          key: aureon-duka-xauusd-v1-{{ epoch }}
          paths:
            - .cache/dukascopy
      - run:
          name: Publish research start
          command: |
            python research/status_event.py --state RUNNING --stage EVOLUTION_RESEARCH --task "Deterministic FVG research" --completed 2 --total 4
            python research/publish_telemetry.py status || true
      - run:
          name: Deterministic FVG research
          command: python research/run_research.py --data "research_data/XAUUSD/canonical/XAUUSD_<< pipeline.parameters.timeframe >>.parquet" --max-candidates "<< pipeline.parameters.max_candidates >>"
          no_output_timeout: 30m
      - run:
          name: Publish verified research result
          command: python research/publish_telemetry.py result || true
      - run:
          name: ASTRA NVIDIA advisory audit
          command: python research/nvidia_quant_auditor.py research_results/research_report.json research_results/astra_nvidia_review.json
      - run:
          name: Publish completion heartbeat
          when: on_success
          command: |
            python research/status_event.py --state IDLE --stage COMPLETE --task "Gold research batch complete" --completed 4 --total 4
            python research/publish_telemetry.py status || true
      - run:
          name: Publish failure state
          when: on_fail
          command: |
            python research/status_event.py --state FAILED --stage PIPELINE --task "Gold research pipeline failed" --completed 0 --total 4 --blocker "Inspect CI evidence artifact/logs"
            python research/publish_telemetry.py status || true
      - run:
          name: Package evidence
          when: always
          command: |
            mkdir -p artifact
            cp -r research_results artifact/ 2>/dev/null || true
            cp research_data/XAUUSD/*manifest.json artifact/ 2>/dev/null || true
            cp research_data/XAUUSD/*gate.json artifact/ 2>/dev/null || true
            cp research_data/XAUUSD/brain/*manifest.json artifact/ 2>/dev/null || true
            cp research/config/fvg_v211_baseline.yml artifact/ 2>/dev/null || true
            git rev-parse HEAD > artifact/source_commit.txt
      - store_artifacts:
          path: artifact
          destination: aureon-gold-research

workflows:
  aureon-gold-research:
    jobs:
      - gold-research:
          filters:
            branches:
              only:
                - feature/gold-research-lab
